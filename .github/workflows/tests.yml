name: tests

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 1 *'  # Runs every January 1st at 00:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: npm install
      - name: Run the linter
        run: npm run lint
      - name: Run the tests
        run: npm test
        env:
          CI: true
